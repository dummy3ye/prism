name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Neovim Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Luacheck / Syntax validation
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq luajit
          find . -name "*.lua" | while read f; do luajit -bl "$f" || exit 1; done

      - name: Bootstrap lazy.nvim
        run: |
          LAZY=${{ env.HOME || '$HOME' }}/.local/share/nvim/lazy/lazy.nvim
          mkdir -p $(dirname $LAZY)
          [ -d "$LAZY" ] || git clone --filter=blob:none --branch=stable https://github.com/folke/lazy.nvim.git "$LAZY"

      - name: Neovim Startup Check
        run: |
          nvim --headless -c "lua require('lazy').setup()" -c "lua require('lazy').sync()" -c "checkhealth" -c "qa!"
