name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Lint & Neovim Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Luacheck / Syntax validation
        run: |
          find . -name "*.lua" -exec luac -p {} +

      - name: Neovim Startup Check
        run: |
          nvim --headless -c "lua require('lazy')" -c "checkhealth" -c "qa!"
