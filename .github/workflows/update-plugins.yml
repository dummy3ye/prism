name: Update Plugins Lockfile

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  update-lockfile:
    name: Update lazy-lock.json
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Update Lazy plugins
        run: |
          nvim --headless "+Lazy! update" +qa

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(deps): update lazy-lock.json"
          title: "chore(deps): update plugin lockfile"
          body: "Automated weekly update of lazy-lock.json."
          branch: "update-lazy-lock"
          delete-branch: true
