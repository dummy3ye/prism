name: Startup Time Benchmark

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  benchmark:
    name: Benchmark Neovim Startup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Install plugins headless
        run: |
          nvim --headless "+Lazy! sync" +qa || true

      - name: Measure startup time
        run: |
          echo "=== Measuring startup time (average over 5 runs) ==="
          for i in {1..5}; do
            nvim --startuptime "startup_$i.log" --headless +qa
            tail -n 1 "startup_$i.log"
          done
