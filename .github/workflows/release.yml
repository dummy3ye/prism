name: Release / Tagged Snapshot

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Archive
        run: |
          tar -czf prism-config.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: prism-config.tar.gz
          generate_release_notes: true
